services:
  bot:
    image: ghcr.io/prafdin/yacloud-resources-watcher:${APP_VERSION:-latest}
    build: .
    container_name: yc-watcher
    restart: unless-stopped
    env_file: .env
    environment:
      YC_SA_KEY_FILE: /secrets/sa-key.json
    volumes:
      - ./sa-key.json:/secrets/sa-key.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
