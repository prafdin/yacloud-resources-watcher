[project]
name = "yc-watcher"
version = "0.1.0"
description = "Telegram bot that posts a daily inventory of resources in a Yandex Cloud folder"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.3,<4",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.2,<3",
    "yandexcloud>=0.400",
    "tzdata",
]

[project.scripts]
yc-watcher = "yc_watcher.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yc_watcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
